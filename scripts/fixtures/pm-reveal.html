<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="{{CSS}}">
<style>html,body{margin:0;height:100%;background:#04101a}
#side{height:300px;width:300px;padding:9px;box-sizing:border-box;display:flex;flex-direction:column}
.cx-pm-scroll{flex:1;min-height:0;overflow:auto}
</style></head>
<body><div class="cx-shell" data-theme="dark"><aside class="cx-pm-side" id="side"><div class="cx-pm-scroll" id="sc">
  <div class="cx-pm-h" id="h"><div class="cx-pm-titleline"><span class="cx-pm-kind">◎</span><span>TARGETS</span><span class="cx-pm-count">12</span></div></div>
  <div class="cx-pm-card" style="height:70px">c0</div>
  <div class="cx-pm-card" style="height:70px">c1</div>
  <div class="cx-pm-card" style="height:70px" id="target">c2</div>
  <div class="cx-pm-card" style="height:70px">c3</div>
  <div class="cx-pm-card" style="height:70px">c4</div>
  <div class="cx-pm-card" style="height:70px">c5</div>
  <div class="cx-pm-card" style="height:70px">c6</div>
  <div class="cx-pm-card" style="height:70px">c7</div>
  <div class="cx-pm-card" style="height:70px">c8</div>
  <div class="cx-pm-card" style="height:70px">c9</div>
  <div class="cx-pm-card" style="height:70px">c10</div>
  <div class="cx-pm-card" style="height:70px">c11</div>
</div></aside></div>
<script>window.addEventListener('load', function () { var sc = document.getElementById('sc'), t = document.getElementById('target'); sc.scrollTop = 600; t.scrollIntoView({ block: 'nearest' }); });</script>
</body></html>
