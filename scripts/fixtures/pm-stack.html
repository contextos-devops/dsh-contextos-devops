<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="{{CSS}}">
<style>html,body{margin:0;height:100%;background:#04101a}
#side{height:300px;width:300px;padding:9px;box-sizing:border-box;display:flex;flex-direction:column}
.cx-pm-scroll{flex:1;min-height:0;overflow:auto}
</style></head>
<body><div class="cx-shell" data-theme="dark"><aside class="cx-pm-side" id="side"><div class="cx-pm-scroll" id="sc">
  <div class="cx-pm-sec" id="s1">
    <div class="cx-pm-h" id="h1" style="--pm-top:0px"><div class="cx-pm-titleline"><span class="cx-pm-kind">◎</span><span>TARGETS</span><span class="cx-pm-count">3</span></div></div>
    <div class="cx-pm-card" style="height:80px">t1</div>
    <div class="cx-pm-card" style="height:80px">t2</div>
    <div class="cx-pm-card on" id="cur1" style="height:80px;--pm-card-top:34px">target current</div>
    <div class="cx-pm-card" style="height:80px">t4</div>
  </div>
  <div class="cx-pm-sec" id="s2">
    <div class="cx-pm-h" id="h2" style="--pm-top:119px"><div class="cx-pm-titleline"><span class="cx-pm-kind">≡</span><span>PLANS</span><span class="cx-pm-count">9</span></div></div>
    <div class="cx-pm-card" style="height:80px">p1</div>
    <div class="cx-pm-card on" id="cur2" style="height:80px;--pm-card-top:153px">plan current</div>
    <div class="cx-pm-card" style="height:80px">p3</div>
    <div class="cx-pm-card" style="height:80px">p4</div>
  </div>
</div></aside></div>
<script>window.addEventListener('load', function () { document.getElementById("sc").scrollTop = 240; });</script>
</body></html>
