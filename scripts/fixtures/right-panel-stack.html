<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="{{CSS}}">
<style>html,body{margin:0;height:100%;background:#04101a}
#side{height:300px;width:300px;padding:9px;box-sizing:border-box;display:flex;flex-direction:column;overflow:auto}
</style></head>
<body><div class="cx-shell" data-theme="dark"><aside class="cx-pm-side right" id="side">
  <div class="cx-calsec" id="cal">
    <div class="cx-pm-h" id="hTime"><div class="cx-pm-titleline"><span class="cx-pm-kind">◷</span><span>TIME</span></div></div>
    <div class="cx-cal" style="height:120px;border:1px solid var(--cx-line)">calendar</div>
  </div>
  <div class="cx-pm-sec" id="sTask">
    <div class="cx-pm-h" id="hTask"><div class="cx-pm-titleline"><span class="cx-pm-kind">☰</span><span>TASKS</span><span class="cx-pm-count">1</span></div></div>
    <div class="cx-pm-card" style="height:70px">t1</div>
    <div class="cx-pm-card on" id="curTask" style="height:70px">current task</div>
    <div class="cx-pm-card" style="height:70px">t3</div>
  </div>
  <div class="cx-pm-sec" id="sRep">
    <div class="cx-pm-h" id="hRep"><div class="cx-pm-titleline"><span class="cx-pm-kind">▤</span><span>REPORTS</span><span class="cx-pm-count">5</span></div></div>
    <div class="cx-card-list">
      <div class="cx-pm-card" style="height:70px">r1</div>
      <div class="cx-pm-card on" id="curRep" style="height:70px">current report</div>
      <div class="cx-pm-card" style="height:70px">r3</div>
    </div>
  </div>
  <div class="cx-pm-sec" id="sFb">
    <div class="cx-pm-h" id="hFb"><div class="cx-pm-titleline"><span class="cx-pm-kind">◇</span><span>FEEDBACK</span></div></div>
    <div class="cx-card-list">
      <div class="cx-pm-card on" id="curFb" style="height:70px">current feedback</div>
      <div class="cx-pm-card" style="height:70px">f2</div>
    </div>
  </div>
</aside></div>
<script>
window.addEventListener('load', function () {
  // 与 50-chat.js 的 pinStack 一致：按 DOM 顺序累加 offsetHeight 写偏移
  var side = document.getElementById('side');
  var off = 0;
  side.querySelectorAll('.cx-pm-sec').forEach(function (sec) {
    var head = sec.querySelector('.cx-pm-h');
    var card = sec.querySelector('.cx-pm-card.on');
    if (head) { head.style.setProperty('--pm-top', off + 'px'); off += head.offsetHeight; }
    if (card) { card.style.setProperty('--pm-card-top', off + 'px'); off += card.offsetHeight + 5; }
  });
  side.scrollTop = 200;
});
</script>
</body></html>
